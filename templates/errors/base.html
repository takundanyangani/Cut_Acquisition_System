{% load static ui %}<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{% endblock %} · ICT Acquisitions</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/theme.js' %}"></script>
</head>
<body>
<main class="error-page" id="main">
  <div class="error-card">
    <div class="docket" role="group" aria-label="Page details">
      <div class="docket-cell"><span class="docket-label">System</span><span class="docket-value">ICT Acquisitions</span></div>
      <div class="docket-cell"><span class="docket-label">Title</span><span class="docket-value">{% block doc_title %}{% endblock %}</span></div>
      <div class="docket-cell"><span class="docket-label">Status code</span><span class="docket-value mono">{% block code %}{% endblock %}</span></div>
    </div>
    <div class="error-code">
      <span class="big" aria-hidden="true">{% block big %}{% endblock %}</span>
      {% block stamp %}{% endblock %}
    </div>
    {% block body %}{% endblock %}
  </div>
</main>
</body>
</html>
