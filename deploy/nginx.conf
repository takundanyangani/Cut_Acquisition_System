# Nginx in front of Gunicorn. Replace the host name and certificate paths.
server {
    listen 80;
    server_name acquisitions.example.ac.zw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name acquisitions.example.ac.zw;

    ssl_certificate     /etc/ssl/certs/acquisitions.crt;
    ssl_certificate_key /etc/ssl/private/acquisitions.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Uploads are capped at ACQ_UPLOAD_MAX_MB (10 MB) per file; allow a few per form.
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
