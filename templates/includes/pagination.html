{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pages">
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} records</span>
  <span class="btn-row">
    {% if page.has_previous %}<a class="btn btn-secondary btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">Previous</a>{% endif %}
    {% if page.has_next %}<a class="btn btn-secondary btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Next</a>{% endif %}
  </span>
</nav>
{% endif %}
